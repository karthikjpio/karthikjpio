<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121319" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Vokabel B2</title>
<style>
:root{
  --bg:#f4f1ea; --bg2:#ece7dc; --card:#fffdf9; --card2:#fbf8f1;
  --ink:#211f1b; --muted:#77716a; --line:#e6e0d4; --soft:#efeade;
  --der:#2563eb; --die:#e11d74; --das:#12a150; --none:#8a7f72;
  --verb:#7c3aed; --adj:#0e7490; --phr:#b45309;
  --good:#12a150; --again:#e0662b; --shadow:26,22,16;
}
@media (prefers-color-scheme: dark){
 :root:not([data-theme=light]){
  --bg:#101116; --bg2:#171922; --card:#1d2029; --card2:#232732;
  --ink:#eceae4; --muted:#9a948b; --line:#2b2f3a; --soft:#20232d;
  --der:#5b9bff; --die:#ff5aa0; --das:#3ad07f; --none:#a99f92;
  --verb:#a78bfa; --adj:#3bc0d8; --phr:#f0a24b;
  --good:#3ad07f; --again:#ff8a4c; --shadow:0,0,0;
 }
}
:root[data-theme=dark]{
  --bg:#101116; --bg2:#171922; --card:#1d2029; --card2:#232732;
  --ink:#eceae4; --muted:#9a948b; --line:#2b2f3a; --soft:#20232d;
  --der:#5b9bff; --die:#ff5aa0; --das:#3ad07f; --none:#a99f92;
  --verb:#a78bfa; --adj:#3bc0d8; --phr:#f0a24b;
  --good:#3ad07f; --again:#ff8a4c; --shadow:0,0,0;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%}
body{
  background:radial-gradient(120% 80% at 50% -10%, var(--bg2), var(--bg));
  color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden; height:100dvh;
  display:flex; flex-direction:column;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
.wrap{max-width:520px; width:100%; margin:0 auto; flex:1; display:flex; flex-direction:column; min-height:0;
  padding:max(12px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
.hidden{display:none!important}

/* ---------- HOME ---------- */
.brand{display:flex; align-items:center; gap:10px; padding:6px 2px 2px}
.brand .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--der),var(--die) 55%,var(--das)); box-shadow:0 6px 16px rgba(var(--shadow),.18)}
.brand h1{font-size:19px; margin:0; letter-spacing:-.02em}
.brand .sub{font-size:12px; color:var(--muted); margin-top:1px}
.streak{margin-left:auto; font-size:13px; font-weight:700; color:var(--muted); display:flex; align-items:center; gap:5px}
.legend{display:flex; gap:8px; margin:14px 2px 6px}
.legend span{flex:1; text-align:center; font-size:12px; font-weight:700; padding:7px 4px; border-radius:11px; background:var(--soft)}
.legend .l-der{color:var(--der)} .legend .l-die{color:var(--die)} .legend .l-das{color:var(--das)}
.section-t{font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin:16px 4px 8px; font-weight:700}
.lessons{display:flex; flex-direction:column; gap:12px; overflow:auto; padding:2px 2px 8px; -webkit-overflow-scrolling:touch}
.lesson{display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line);
  border-radius:18px; padding:15px 16px; text-align:left; width:100%; transition:transform .12s, box-shadow .12s;
  box-shadow:0 2px 10px rgba(var(--shadow),.05)}
.lesson:active{transform:scale(.985)}
.lesson .num{font-size:12px; font-weight:800; color:var(--muted)}
.lesson .t{font-size:16.5px; font-weight:750; letter-spacing:-.01em}
.lesson .d{font-size:12.5px; color:var(--muted); margin-top:2px}
.lesson .meta{font-size:11.5px; color:var(--muted); margin-top:7px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.pill{font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--soft)}
.pill.due{background:color-mix(in srgb,var(--again) 16%,transparent); color:var(--again)}
.pill.new{background:color-mix(in srgb,var(--der) 15%,transparent); color:var(--der)}
.ring{--p:0; width:52px;height:52px; flex:none; border-radius:50%;
  background:conic-gradient(var(--das) calc(var(--p)*1%), var(--soft) 0);
  display:grid; place-items:center; position:relative}
.ring::after{content:""; position:absolute; inset:5px; border-radius:50%; background:var(--card)}
.ring b{position:relative; font-size:13px; font-weight:800}
.foot{display:flex; gap:10px; margin-top:12px}
.foot button{flex:1; font-size:13px; font-weight:700; color:var(--muted); background:var(--soft); border-radius:12px; padding:11px}
.version{text-align:center; font-size:11px; letter-spacing:.04em; color:var(--muted); opacity:.65; margin-top:12px; padding-bottom:4px}

/* ---------- STUDY ---------- */
#study{flex:1; display:flex; flex-direction:column; min-height:0}
.topbar{display:flex; align-items:center; gap:12px; padding:2px 2px 6px}
.iconbtn{width:38px;height:38px;border-radius:12px; display:grid; place-items:center; background:var(--soft); font-size:18px}
.progress{flex:1; height:8px; border-radius:99px; background:var(--soft); overflow:hidden}
.progress i{display:block; height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,var(--der),var(--das)); transition:width .3s}
.count{font-size:12.5px; font-weight:700; color:var(--muted); min-width:44px; text-align:right}
.stage{position:relative; flex:1; min-height:0; margin:6px 0 8px; touch-action:none; perspective:1400px}
.card{position:absolute; inset:0; border-radius:26px; will-change:transform;
  background:var(--card); border:1px solid var(--line);
  box-shadow:0 18px 50px rgba(var(--shadow),.14); overflow:hidden}
.card.behind{transform:scale(.94) translateY(14px); filter:saturate(.9) brightness(.99); z-index:1}
.card.top{z-index:2}
.card-inner{position:absolute; inset:0; transform-style:preserve-3d; transition:transform .42s cubic-bezier(.2,.7,.2,1)}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  display:flex; flex-direction:column; padding:22px; overflow:auto}
.back{transform:rotateY(180deg); background:var(--card2)}
.chiprow{display:flex; align-items:center; gap:8px}
.chip{font-size:11.5px; font-weight:800; letter-spacing:.03em; padding:5px 10px; border-radius:999px; background:var(--soft); color:var(--muted)}
.chip.sec{background:transparent; border:1px solid var(--line)}
.chip.pos-v{color:var(--verb); background:color-mix(in srgb,var(--verb) 13%,transparent)}
.chip.pos-adj{color:var(--adj); background:color-mix(in srgb,var(--adj) 13%,transparent)}
.chip.pos-n{color:var(--none); background:color-mix(in srgb,var(--none) 13%,transparent)}
.chip.pos-phr{color:var(--phr); background:color-mix(in srgb,var(--phr) 13%,transparent)}
.spk{margin-left:auto; width:40px;height:40px;border-radius:12px; background:var(--soft); display:grid; place-items:center; font-size:18px}
.spk:active{transform:scale(.9)}
.frontmid{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:16px}
.word{font-size:clamp(30px,8.5vw,44px); font-weight:800; letter-spacing:-.02em; line-height:1.1}
.artq{font-size:15px; font-weight:800; letter-spacing:.14em; color:var(--muted); border:1.5px dashed var(--line); padding:6px 14px; border-radius:999px}
.hinttap{font-size:12.5px; color:var(--muted)}
/* back */
.b-emoji{font-size:46px; line-height:1; margin:10px 0 2px; filter:drop-shadow(0 3px 6px rgba(var(--shadow),.18))}
.b-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-top:6px}
.b-art{font-size:34px; font-weight:800; letter-spacing:-.02em}
.b-word{font-size:34px; font-weight:800; letter-spacing:-.02em}
.b-plural{font-size:14px; color:var(--muted); font-weight:700}
.g-der{color:var(--der)} .g-die{color:var(--die)} .g-das{color:var(--das)} .g-none{color:var(--ink)}
.b-note{font-size:12.5px; color:var(--muted); margin-top:2px}
.def{margin-top:16px; font-size:18px; line-height:1.42; font-weight:600}
.def .en{color:var(--muted)}
.sentence{margin-top:16px; padding:14px 15px; background:var(--card); border:1px solid var(--line); border-radius:15px;
  font-size:16.5px; line-height:1.5; display:flex; gap:10px; align-items:flex-start}
.sentence b{font-weight:800}
.sentence .mini{margin-left:auto; flex:none; width:34px;height:34px;border-radius:10px; background:var(--soft); display:grid; place-items:center; font-size:15px}
.colloc{margin-top:12px; font-size:13px; color:var(--muted)}
.colloc b{color:var(--ink); font-weight:700}
.toggle{margin-top:16px; align-self:flex-start; font-size:12.5px; font-weight:800; color:var(--der); background:color-mix(in srgb,var(--der) 12%,transparent); padding:8px 13px; border-radius:999px}
/* swipe indicators */
.stamp{position:absolute; top:22px; font-size:15px; font-weight:900; letter-spacing:.05em; padding:8px 14px; border-radius:12px; border:2.5px solid; opacity:0; transform:rotate(-8deg); pointer-events:none}
.stamp.know{right:20px; color:var(--good); border-color:var(--good)}
.stamp.again{left:20px; color:var(--again); border-color:var(--again); transform:rotate(8deg)}
.glow{position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .1s}
/* action buttons */
.actions{display:flex; align-items:center; justify-content:center; gap:16px; padding:4px 0 2px}
.act{width:60px;height:60px;border-radius:50%; display:grid; place-items:center; font-size:24px; font-weight:800;
  background:var(--card); border:1px solid var(--line); box-shadow:0 6px 16px rgba(var(--shadow),.1)}
.act:active{transform:scale(.92)}
.act.again{color:var(--again)} .act.know{color:var(--good)}
.act.flip{width:52px;height:52px; font-size:20px; color:var(--muted)}
.act.undo{width:46px;height:46px; font-size:17px; color:var(--muted); background:var(--soft); border:none}
.act.sm{width:46px;height:46px;font-size:18px}
.swipehints{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted); padding:0 8px 2px; font-weight:600}

/* ---------- DONE ---------- */
#done{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; padding:20px}
#done .big{font-size:54px}
#done h2{margin:0; font-size:24px}
#done p{color:var(--muted); margin:0; font-size:14.5px}
.donebtns{display:flex; gap:10px; margin-top:8px; width:100%; max-width:320px}
.donebtns button{flex:1; padding:13px; border-radius:14px; font-weight:750; font-size:14.5px}
.btn-primary{background:linear-gradient(135deg,var(--der),var(--das)); color:#fff}
.btn-ghost{background:var(--soft); color:var(--ink)}
.stats{display:flex; gap:20px; margin-top:4px}
.stats div{font-size:13px; color:var(--muted)}
.stats b{display:block; font-size:22px; color:var(--ink)}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--bg); font-size:13px; font-weight:600; padding:10px 16px; border-radius:999px; opacity:0;
  transition:.25s; pointer-events:none; z-index:50}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">

  <!-- HOME -->
  <div id="home">
    <div class="brand">
      <div class="logo">V</div>
      <div>
        <h1>Vokabel B2</h1>
        <div class="sub">Kompass DaF · Lektion 1–4</div>
      </div>
      <div class="streak" id="streak" title="Lernserie">🔥 <span id="streakN">0</span></div>
    </div>

    <div class="legend">
      <span class="l-der">der</span>
      <span class="l-die">die</span>
      <span class="l-das">das</span>
    </div>

    <div class="section-t">Lektionen</div>
    <div class="lessons" id="lessonList"></div>

    <div class="foot">
      <button id="themeBtn">🌓 Design</button>
      <button id="resetBtn">↺ Fortschritt</button>
    </div>
    <div class="version">v1.1</div>
  </div>

  <!-- STUDY -->
  <div id="study" class="hidden">
    <div class="topbar">
      <button class="iconbtn" id="backBtn">‹</button>
      <div class="progress"><i id="progBar"></i></div>
      <div class="count" id="count">0/0</div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="swipehints"><span>← Nochmal</span><span>Kann ich →</span></div>
    <div class="actions">
      <button class="act undo" id="undoBtn" title="Rückgängig">↶</button>
      <button class="act again sm" id="againBtn">✗</button>
      <button class="act flip" id="flipBtn">↻</button>
      <button class="act know sm" id="knowBtn">✓</button>
      <button class="act undo" id="soundBtn" title="Ton">🔊</button>
    </div>
  </div>

  <!-- DONE -->
  <div id="done" class="hidden">
    <div class="big">🎉</div>
    <h2 id="doneTitle">Fertig!</h2>
    <p id="doneSub"></p>
    <div class="stats">
      <div><b id="stKnow">0</b>Kann ich</div>
      <div><b id="stAgain">0</b>Nochmal</div>
      <div><b id="stMaster">0</b>Gemeistert</div>
    </div>
    <div class="donebtns">
      <button class="btn-ghost" id="doneHome">Startseite</button>
      <button class="btn-primary" id="doneAgain">Weiter lernen</button>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script src="emoji.js?v=3"></script>
<script src="deck_l1.js?v=3"></script>
<script src="deck_l2.js?v=3"></script>
<script src="deck_l3.js?v=3"></script>
<script src="deck_l4.js?v=3"></script>
<script src="app.js?v=3"></script>
</body>
</html>
